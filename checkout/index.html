<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Ari</title>
  <meta name="description" content="Complete your Ari Pro subscription." />
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />

  <style>
    .co__brand {
      position: absolute;
      top: var(--sp-6);
      left: var(--gutter);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--sz-md);
      color: var(--c-ink);
    }
    .co {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--sp-8) var(--gutter);
      background:
        radial-gradient(1200px 600px at 50% -10%, var(--c-violet-pale), transparent 70%),
        var(--c-ground);
    }
    .co__card {
      max-width: 480px;
      width: 100%;
      text-align: center;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--r-2xl);
      box-shadow: var(--shadow-xl);
      padding: clamp(2rem, 6vw, 3.5rem);
    }
    .co__visual {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 76px;
      margin-bottom: var(--sp-6);
    }
    .co__spinner {
      width: 40px;
      height: 40px;
      border-radius: var(--r-full);
      border: 3px solid var(--c-violet-tint);
      border-top-color: var(--c-violet);
      animation: co-spin 800ms linear infinite;
    }
    @keyframes co-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .co__spinner { animation-duration: 2400ms; }
    }
    .co__badge {
      width: 76px;
      height: 76px;
      border-radius: var(--r-full);
      display: grid;
      place-items: center;
      animation: co-pop 460ms cubic-bezier(.2, .9, .3, 1.3) both;
    }
    .co__badge svg { width: 36px; height: 36px; }
    @keyframes co-pop {
      from { transform: scale(.4); opacity: 0; }
      to   { transform: scale(1);  opacity: 1; }
    }
    .co__badge--muted   { background: var(--c-border-light); color: var(--c-muted); }
    .co__badge--amber   { background: #F5EFE5; color: #7A5424; }
    .co__badge--warn    { background: var(--c-rose-tint); color: var(--c-rose); }
    .co__badge--success { background: var(--c-violet-tint); color: var(--c-violet); box-shadow: var(--shadow-violet); }
    .co__eyebrow {
      display: inline-block;
      font-family: var(--font-body);
      font-size: var(--sz-xs);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--c-violet);
      background: var(--c-violet-pale);
      border-radius: var(--r-full);
      padding: var(--sp-2) var(--sp-4);
      margin-bottom: var(--sp-5);
    }
    .co__title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: var(--sz-2xl);
      line-height: 1.15;
      color: var(--c-ink);
      margin-bottom: var(--sp-3);
    }
    .co__sub {
      font-family: var(--font-body);
      font-size: var(--sz-md);
      line-height: 1.55;
      color: var(--c-muted);
    }
    .co__actions {
      margin-top: var(--sp-8);
      display: none;
      flex-direction: column;
      gap: var(--sp-3);
    }
    .co__actions .btn { width: 100%; justify-content: center; }
    .co__trust {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      margin-top: var(--sp-8);
      font-family: var(--font-body);
      font-size: var(--sz-xs);
      color: var(--c-muted);
    }
    .co__trust svg { flex-shrink: 0; opacity: .7; }
  </style>
</head>
<body>
  <a href="/" class="co__brand" aria-label="Ari home">
    <span class="brand-mark" aria-hidden="true"></span>
    Ari
  </a>

  <main class="co">
    <div class="co__card">
      <div class="co__visual">
        <div class="co__spinner" id="co-spinner" aria-hidden="true"></div>
        <div class="co__badge" id="co-badge" hidden aria-hidden="true"></div>
      </div>

      <span class="co__eyebrow">Ari Pro</span>

      <h1 class="co__title" id="co-title">Preparing your checkout</h1>
      <p class="co__sub" id="co-sub">Hang tight — this only takes a second.</p>

      <div class="co__actions" id="co-actions"></div>

      <p class="co__trust" id="co-trust">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        Payments are securely processed by Paddle
      </p>
    </div>
  </main>

  <script>
    // Small state machine driving the card while Paddle's overlay is doing
    // the actual work. Kept as plain globals (no IIFE) so the Paddle.Initialize
    // block further down can reach `render` and `txn` directly.
    var ICONS = {
      info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
      paused: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',
      warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>',
      success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
    };
    var ARROW = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';

    var spinnerEl = document.getElementById('co-spinner');
    var badgeEl = document.getElementById('co-badge');
    var titleEl = document.getElementById('co-title');
    var subEl = document.getElementById('co-sub');
    var actionsEl = document.getElementById('co-actions');
    var trustEl = document.getElementById('co-trust');

    function render(state) {
      spinnerEl.hidden = state !== 'loading';
      badgeEl.hidden = state === 'loading';
      trustEl.hidden = state === 'no-transaction' || state === 'completed';
      actionsEl.style.display = state === 'loading' ? 'none' : 'flex';

      if (state === 'no-transaction') {
        badgeEl.className = 'co__badge co__badge--muted';
        badgeEl.innerHTML = ICONS.info;
        titleEl.textContent = 'No checkout in progress';
        subEl.textContent = "This page opens automatically when you start upgrading to Ari Pro from the extension.";
        actionsEl.innerHTML = '<a href="/" class="btn btn--primary btn--lg">Back to Ari' + ARROW + '</a>';
      } else if (state === 'closed') {
        badgeEl.className = 'co__badge co__badge--amber';
        badgeEl.innerHTML = ICONS.paused;
        titleEl.textContent = 'Checkout closed';
        subEl.textContent = "You closed the payment window before finishing — you haven't been charged.";
        actionsEl.innerHTML =
          '<button type="button" class="btn btn--primary btn--lg" id="co-resume">Resume checkout' + ARROW + '</button>' +
          '<a href="/" class="btn btn--secondary btn--lg">Back to Ari</a>';
        document.getElementById('co-resume').addEventListener('click', function () {
          render('loading');
          armTimeout();
          Paddle.Checkout.open({ transactionId: txn });
        });
      } else if (state === 'error') {
        badgeEl.className = 'co__badge co__badge--warn';
        badgeEl.innerHTML = ICONS.warn;
        titleEl.textContent = 'Something went wrong';
        subEl.textContent = "We couldn't load your checkout. Please try again, or reach out if the issue persists.";
        actionsEl.innerHTML =
          '<button type="button" class="btn btn--primary btn--lg" id="co-retry">Try again</button>' +
          '<a href="mailto:hello@ari.app" class="btn btn--secondary btn--lg">Contact support</a>';
        document.getElementById('co-retry').addEventListener('click', function () {
          location.reload();
        });
      } else if (state === 'completed') {
        badgeEl.className = 'co__badge co__badge--success';
        badgeEl.innerHTML = ICONS.success;
        titleEl.textContent = 'Payment received';
        subEl.textContent = 'Redirecting you now…';
        actionsEl.innerHTML = '';
      }
    }

    var txn = new URLSearchParams(location.search).get('_ptxn');
    if (!txn) {
      render('no-transaction');
    }
  </script>

  <!-- Paddle.js — auto-detects the _ptxn transaction id in the URL (appended
       by the worker's checkout.url, see workers/src/features/billing/paddle.ts)
       and opens the checkout overlay with no further JS needed on our end.
       We still listen for its lifecycle events below so a closed overlay or a
       failed load shows a proper message instead of a stuck spinner. -->
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script>
    var loadTimeout;
    function armTimeout() {
      clearTimeout(loadTimeout);
      // Paddle should fire an event (loaded, error, or otherwise) well within
      // this window. If it never does — blocked script, bad token, dead
      // network — stop spinning forever and show something actionable.
      loadTimeout = setTimeout(function () { render('error'); }, 12000);
    }
    if (txn) {
      armTimeout();
    }

    Paddle.Environment.set('sandbox');
    Paddle.Initialize({
      // Public, frontend-safe token (not the PADDLE_API_KEY server secret) —
      // Paddle dashboard → Developer Tools → Authentication → Client-side tokens.
      // token: 'live_f93ed91d58b8ea34a06fab0ea94',
      token: 'test_b3ca2be81056b9fc47051678f2a',
      eventCallback: function (event) {
        clearTimeout(loadTimeout);
        if (event.name === 'checkout.closed') {
          render('closed');
        } else if (event.name === 'checkout.error') {
          render('error');
        } else if (event.name === 'checkout.completed') {
          render('completed');
        }
      },
      checkout: {
        settings: {
          successUrl: location.origin + '/thank-you/',
        },
      },
    });
  </script>
</body>
</html>
