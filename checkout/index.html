<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Ari</title>
  <meta name="description" content="Complete your Ari Pro subscription." />
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />

  <style>
    .co {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--sp-8) var(--gutter);
      background:
        radial-gradient(1200px 600px at 50% -10%, var(--c-violet-pale), transparent 70%),
        var(--c-ground);
    }
    .co__content {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .co__visual {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 64px;
      margin-bottom: var(--sp-6);
    }
    .co__spinner {
      width: 36px;
      height: 36px;
      border-radius: var(--r-full);
      border: 3px solid var(--c-violet-tint);
      border-top-color: var(--c-violet);
      animation: co-spin 800ms linear infinite;
    }
    @keyframes co-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .co__spinner { animation-duration: 2400ms; }
    }
    .co__icon {
      width: 64px;
      height: 64px;
      border-radius: var(--r-full);
      display: grid;
      place-items: center;
      animation: co-pop 420ms cubic-bezier(.2, .9, .3, 1.3) both;
    }
    .co__icon svg { width: 28px; height: 28px; }
    @keyframes co-pop {
      from { transform: scale(.5); opacity: 0; }
      to   { transform: scale(1);  opacity: 1; }
    }
    .co__visual--muted   .co__icon { background: var(--c-border-light); color: var(--c-muted); }
    .co__visual--amber   .co__icon { background: #F5EFE5; color: #7A5424; }
    .co__visual--warn    .co__icon { background: var(--c-rose-tint); color: var(--c-rose); }
    .co__visual--success .co__icon { background: var(--c-violet-tint); color: var(--c-violet); box-shadow: var(--shadow-violet); }
    .co__eyebrow {
      font-family: var(--font-body);
      font-size: var(--sz-xs);
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--c-violet);
      margin-bottom: var(--sp-3);
    }
    .co__title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: var(--sz-2xl);
      line-height: 1.15;
      color: var(--c-ink);
      margin-bottom: var(--sp-3);
    }
    .co__sub {
      font-family: var(--font-body);
      font-size: var(--sz-md);
      line-height: 1.55;
      color: var(--c-muted);
    }
    .co__actions {
      max-width: 300px;
      margin: var(--sp-8) auto 0;
      display: none;
      flex-direction: column;
      gap: var(--sp-3);
    }
    .co__actions .btn { width: 100%; justify-content: center; }
    .co__trust {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      margin-top: var(--sp-8);
      font-family: var(--font-body);
      font-size: var(--sz-xs);
      color: var(--c-muted);
    }
    .co__trust svg { flex-shrink: 0; opacity: .7; }
  </style>
</head>
<body>
  <main class="co">
    <div class="co__content">
      <div class="co__visual" id="co-visual"><div class="co__spinner" aria-hidden="true"></div></div>

      <p class="co__eyebrow">Ari Pro</p>
      <h1 class="co__title" id="co-title">Preparing your checkout</h1>
      <p class="co__sub" id="co-sub">Hang tight — this only takes a second.</p>

      <div class="co__actions" id="co-actions"></div>

      <p class="co__trust" id="co-trust">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        Payments are securely processed by Paddle
      </p>
    </div>
  </main>

  <script>
    // Single-source-of-truth state machine for the page. Every state fully
    // replaces the visual (spinner/icon) and actions instead of toggling
    // hidden flags, so two icons can never end up on screen at once.
    var ICONS = {
      info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
      paused: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',
      warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>',
      success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
    };
    var ARROW = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';

    var STATES = {
      loading: {
        title: 'Preparing your checkout',
        sub: 'Hang tight — this only takes a second.',
        trust: true
      },
      'no-transaction': {
        tone: 'muted', icon: 'info',
        title: 'No checkout in progress',
        sub: 'This page opens automatically when you start upgrading to Ari Pro from the extension.',
        trust: false,
        actions: [{ label: 'Back to Ari', href: '/', variant: 'primary', arrow: true }]
      },
      closed: {
        tone: 'amber', icon: 'paused',
        title: 'Checkout closed',
        sub: "You closed the payment window before finishing — you haven't been charged.",
        trust: true,
        actions: [
          { label: 'Resume checkout', variant: 'primary', arrow: true, run: 'resume' },
          { label: 'Back to Ari', href: '/', variant: 'secondary' }
        ]
      },
      error: {
        tone: 'warn', icon: 'warn',
        title: 'Something went wrong',
        sub: "We couldn't load your checkout. Please try again, or reach out if the issue persists.",
        trust: true,
        actions: [
          { label: 'Try again', variant: 'primary', run: 'retry' },
          { label: 'Contact support', href: 'mailto:hello@ari.app', variant: 'secondary' }
        ]
      },
      completed: {
        tone: 'success', icon: 'success',
        title: 'Payment received',
        sub: 'Redirecting you now…',
        trust: false
      }
    };

    var visualEl = document.getElementById('co-visual');
    var titleEl = document.getElementById('co-title');
    var subEl = document.getElementById('co-sub');
    var actionsEl = document.getElementById('co-actions');
    var trustEl = document.getElementById('co-trust');

    function render(name) {
      var s = STATES[name];

      visualEl.className = 'co__visual' + (s.tone ? ' co__visual--' + s.tone : '');
      visualEl.innerHTML = s.icon
        ? '<div class="co__icon" aria-hidden="true">' + ICONS[s.icon] + '</div>'
        : '<div class="co__spinner" aria-hidden="true"></div>';

      titleEl.textContent = s.title;
      subEl.textContent = s.sub;
      trustEl.hidden = !s.trust;

      if (s.actions) {
        actionsEl.style.display = 'flex';
        actionsEl.innerHTML = s.actions.map(function (a, i) {
          var tag = a.href ? 'a' : 'button';
          var hrefAttr = a.href ? ' href="' + a.href + '"' : ' type="button"';
          return '<' + tag + ' class="btn btn--' + a.variant + ' btn--lg" id="co-action-' + i + '"' + hrefAttr + '>' +
            a.label + (a.arrow ? ARROW : '') + '</' + tag + '>';
        }).join('');
        s.actions.forEach(function (a, i) {
          if (!a.run) return;
          document.getElementById('co-action-' + i).addEventListener('click', function () {
            if (a.run === 'resume') {
              render('loading');
              armTimeout();
              Paddle.Checkout.open({ transactionId: txn });
            } else if (a.run === 'retry') {
              location.reload();
            }
          });
        });
      } else {
        actionsEl.style.display = 'none';
        actionsEl.innerHTML = '';
      }
    }

    var txn = new URLSearchParams(location.search).get('_ptxn');
    render(txn ? 'loading' : 'no-transaction');
    var __d = new URLSearchParams(location.search).get('__debug_state');
    if (__d && STATES[__d]) { render(__d); }
  </script>

  <!-- Paddle.js — auto-detects the _ptxn transaction id in the URL (appended
       by the worker's checkout.url, see workers/src/features/billing/paddle.ts)
       and opens the checkout overlay with no further JS needed on our end.
       We still listen for its lifecycle events below so a closed overlay or a
       failed load shows a proper message instead of a stuck spinner. -->
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script>
    var loadTimeout;
    function armTimeout() {
      clearTimeout(loadTimeout);
      // Paddle should fire an event (loaded, error, or otherwise) well within
      // this window. If it never does — blocked script, bad token, dead
      // network — stop spinning forever and show something actionable.
      loadTimeout = setTimeout(function () { render('error'); }, 12000);
    }
    if (txn) {
      armTimeout();
    }

    Paddle.Environment.set('sandbox');
    Paddle.Initialize({
      // Public, frontend-safe token (not the PADDLE_API_KEY server secret) —
      // Paddle dashboard → Developer Tools → Authentication → Client-side tokens.
      // token: 'live_f93ed91d58b8ea34a06fab0ea94',
      token: 'test_b3ca2be81056b9fc47051678f2a',
      eventCallback: function (event) {
        clearTimeout(loadTimeout);
        if (event.name === 'checkout.closed') {
          render('closed');
        } else if (event.name === 'checkout.error') {
          render('error');
        } else if (event.name === 'checkout.completed') {
          render('completed');
        }
      },
      checkout: {
        settings: {
          successUrl: location.origin + '/thank-you/',
        },
      },
    });
  </script>
</body>
</html>
