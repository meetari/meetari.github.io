<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank you — Ari</title>
  <meta name="description" content="Your Ari subscription is active. Thanks for supporting focused browsing." />
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />

  <style>
    .ty__brand {
      position: absolute;
      top: var(--sp-6);
      left: var(--gutter);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--sz-md);
      color: var(--c-ink);
    }
    .ty {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--sp-8) var(--gutter);
      background:
        radial-gradient(1200px 600px at 50% -10%, var(--c-violet-pale), transparent 70%),
        var(--c-ground);
    }
    .ty__card {
      max-width: 520px;
      width: 100%;
      text-align: center;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--r-2xl);
      box-shadow: var(--shadow-xl);
      padding: clamp(2rem, 6vw, 3.5rem);
    }
    .ty__badge {
      width: 76px;
      height: 76px;
      margin: 0 auto var(--sp-6);
      border-radius: var(--r-full);
      display: grid;
      place-items: center;
      background: var(--c-violet-tint);
      color: var(--c-violet);
      box-shadow: var(--shadow-violet);
      animation: ty-pop 460ms cubic-bezier(.2, .9, .3, 1.3) both;
    }
    .ty__badge svg { width: 38px; height: 38px; }
    @keyframes ty-pop {
      from { transform: scale(.4); opacity: 0; }
      to   { transform: scale(1);  opacity: 1; }
    }
    .ty__eyebrow {
      display: inline-block;
      font-family: var(--font-body);
      font-size: var(--sz-xs);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--c-violet);
      background: var(--c-violet-pale);
      border-radius: var(--r-full);
      padding: var(--sp-2) var(--sp-4);
      margin-bottom: var(--sp-5);
    }
    .ty__title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: var(--sz-3xl);
      line-height: 1.08;
      color: var(--c-ink);
      margin-bottom: var(--sp-4);
    }
    .ty__title em { font-style: italic; color: var(--c-violet); }
    .ty__sub {
      font-family: var(--font-body);
      font-size: var(--sz-md);
      line-height: 1.55;
      color: var(--c-muted);
      margin-bottom: var(--sp-8);
    }
    .ty__actions {
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      align-items: center;
    }
    .ty__actions .btn { width: 100%; justify-content: center; }
    .ty__meta {
      margin-top: var(--sp-6);
      font-family: var(--font-body);
      font-size: var(--sz-xs);
      color: var(--c-muted);
      word-break: break-all;
    }
    .ty__meta code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--c-ink);
    }
  </style>
</head>
<body>
  <a href="/" class="ty__brand" aria-label="Ari home">
    <span class="brand-mark" aria-hidden="true"></span>
    Ari
  </a>

  <main class="ty">
    <div class="ty__card">
      <div class="ty__badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5" />
        </svg>
      </div>

      <span class="ty__eyebrow">Payment confirmed</span>

      <h1 class="ty__title">You're all set — <em>thank you</em></h1>

      <p class="ty__sub">
        Your Ari subscription is active. Head back to the extension and your
        Pro features will be unlocked. A receipt is on its way to your inbox.
      </p>

      <div class="ty__actions">
        <a href="/" class="btn btn--primary btn--lg">
          Back to Ari
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </div>

      <p class="ty__meta" id="ty-ref" hidden>Reference: <code id="ty-ref-val"></code></p>
    </div>
  </main>

  <script>
    (function () {
      var p = new URLSearchParams(globalThis.location.search);
      var txn = p.get('_ptxn') || p.get('transaction_id') || p.get('txn');
      if (txn) {
        document.getElementById('ty-ref-val').textContent = txn;
        document.getElementById('ty-ref').hidden = false;
      }
    })();
  </script>
</body>
</html>
